# Configuration for FAST-LIO2 with Ouster OS1-64 LiDAR and built-in IMU
# Tuned for DRDO Off-Road Autonomous Ground Vehicle (AGV)

common:
  lid_topic: "/ouster/points"
  imu_topic: "/ouster/imu"
  time_sync_en: false         # True if hardware PTP sync not active
  time_offset_lidar_to_imu: 0.0

preprocess:
  lidar_type: 2               # 2: Ouster OS1-64
  scan_line: 64
  scan_rate: 10               # 10 Hz
  timestamp_unit: 3           # 3: Nanoseconds
  blind: 0.5                  # Blind radius (meters)

mapping:
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  fov_degree: 360
  det_range: 100.0
  extrinsic_est_en: false     # Set to true for online extrinsic calibration
  extrinsic_T: [0.0, 0.0, 0.0]
  extrinsic_R: [1, 0, 0,
                0, 1, 0,
                0, 0, 1]

publish:
  path_en: true
  scan_publish_en: true
  dense_publish_en: true
  scan_bodyframe_pub_en: false
